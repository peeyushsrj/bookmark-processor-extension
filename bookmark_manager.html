<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bookmark Carousel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Bookmark Carousel</h1>
  <div id="carousel-container">
    <div id="bookmark-display">
      <div id="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <p id="progress-percentage"></p>
      <p id="bookmark-progress"></p>
      <p id="bookmark-title"></p>
      <p id="bookmark-url"><a id="bookmark-link" href="#" target="_blank" rel="noopener noreferrer"></a></p>
    </div>
    <div id="carousel-controls">
      <button id="previous-button">Previous</button>
      <button id="keep-button">Keep</button>
      <button id="delete-button">Delete</button>
    </div>
  </div>

  <!-- Include local jQuery -->
  <script src="jquery.min.js"></script>
  <script src="bookmark_manager.js"></script>
</body>
</html>
